name: Build kernel

# ============================================================================
#  Builds three kernel variants for the Samsung Galaxy A24 (SM-A245F) against
#  the A245FXXS9DYG1 firmware base, then publishes a single GitHub Release
#  containing the Odin payloads and the exactly-matching manager APKs.
#
#  Why CI: the kernel is a 5.10 GKI tree with the whole MediaTek vendor module
#  set. It needs ~16 GB of disk and several GB of RAM, plus flex/bison and a
#  full clang toolchain. Running it on GitHub runners keeps the build
#  reproducible and keeps produced binaries out of git history.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which variant to build'
        required: true
        default: 'all'
        type: choice
        options: [all, vanilla, kernelsu, kernelsu-up]
      hardened:
        description: 'Keep Samsung security features on (RKP/KDP/DEFEX/FIVE/PROCA). Boot is unlikely.'
        required: true
        default: false
        type: boolean
      stock_boot:
        description: 'Optional: stock boot.img for the base firmware. Its ramdisk is carried into the kernel image. Without it the image has an empty initramfs and cannot boot.'
        required: false
        default: ''
        type: string
      stock_ramdisk:
        description: 'Optional: ramdisk file to embed. Blank uses the checked-in stock_ramdisk/a24_dyg1_ramdisk.img, which is the real initramfs from A245FXXS9DYG1 recovery.img.'
        required: false
        default: ''
        type: string
      keep_security:
        description: "Leave the tree's own RKP/KDP/DEFEX/FIVE/PROCA settings alone. Correct for the VH-Devices tree, which ships them enabled."
        required: true
        default: true
        type: boolean
      publish:
        description: 'Publish a GitHub Release'
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Release tag to publish under (blank = date-stamped)'
        required: false
        default: 'v1.0.0-kernel'
        type: string

  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          V="${{ github.event.inputs.variant || 'all' }}"
          if [ "$V" = "all" ]; then
            echo 'matrix=["vanilla","kernelsu","kernelsu-up"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$V\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # kconfig frontend needs these; we avoid them at configure time but the
      # final `make` still invokes scripts that benefit from them.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev lz4 zstd cpio \
            python3 python3-pip rsync kmod
          pip3 install --quiet kconfiglib

      # check_built_boot.py decompresses the ramdisk to confirm it contains an
      # /init. The stock ramdisk is lz4, and Ubuntu's pip is
      # externally-managed, so --break-system-packages is needed here.
      - name: Install lz4 for ramdisk verification
        run: python3 -m pip install --quiet --break-system-packages lz4 || pip3 install --quiet lz4

      - name: Show toolchain budget
        run: |
          echo "CPUs : $(nproc)"
          echo "RAM  : $(free -h | awk '/Mem:/{print $2}')"
          echo "DISK : $(df -h / | awk 'NR==2{print $4}')"

      - name: Cache kernel source and toolchain
        uses: actions/cache@v4
        with:
          path: |
            work/kernel
            work/toolchain
          key: ksrc-${{ hashFiles('config.env') }}

      - name: Build ${{ matrix.variant }}
        run: |
          chmod +x scripts/*.sh scripts/*.py
          FLAGS="--variant ${{ matrix.variant }} --jobs $(nproc)"
          if [ "${{ github.event.inputs.hardened }}" = "true" ]; then
            FLAGS="$FLAGS --harden"
          fi
          if [ "${{ github.event.inputs.keep_security }}" = "true" ]; then
            FLAGS="$FLAGS --keep-security"
          fi
          if [ -n "${{ github.event.inputs.stock_boot }}" ]; then
            FLAGS="$FLAGS --stock-boot ${{ github.event.inputs.stock_boot }}"
          fi
          # The real ramdisk for this device is not in boot.img: its boot
          # image is a v4/GKI stub with a 1.9 MiB first-stage ramdisk, and
          # vendor_boot fails signature verification, so LK never loads a
          # ramdisk from it. The 26 MiB initramfs lives in recovery.img, and
          # recovery.img's layout matches the image we build (page 4096,
          # kernel 0x40000000, ramdisk 0x66f00000, tags 0x47c80000).
          RD="${{ github.event.inputs.stock_ramdisk }}"
          if [ -z "$RD" ] && [ -f stock_ramdisk/a24_dyg1_ramdisk.img ]; then
            RD="stock_ramdisk/a24_dyg1_ramdisk.img"
          fi
          if [ -n "$RD" ]; then
            FLAGS="$FLAGS --stock-ramdisk $RD"
          fi
          set +e
          ./scripts/build-kernel.sh $FLAGS 2>&1 | tee build-trace.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "build exit code: $RC"
          echo $RC > build-rc.txt
          if [ "$RC" -ne 0 ]; then
            # Prefer real compiler diagnostics over the make error cascade.
            SEL=$(grep -E "error:|fatal error:|undefined reference" build-trace.log | grep -v "\*\*\*" | head -12)
            if [ -z "$SEL" ]; then
              SEL=$(grep -E "\*\*\*|Error [0-9]|No such file" build-trace.log | tail -12)
            fi
            MSG=$(printf '%s\n' "$SEL" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed (rc=$RC)::${MSG}"
            exit "$RC"
          fi

      # A boot image can be built perfectly well and still be worthless: if
      # its ramdisk is the empty placeholder, the kernel finds no /init, has
      # no root= on the cmdline, waits ~20 s for a root device and panics with
      # panic=-1, so the watchdog cuts power. Fail the build instead of
      # shipping that.
      - name: Verify the boot images carry a real initramfs
        if: success()
        run: |
          echo "dist/ contents:"
          ls -la dist/ || echo "(no dist directory)"
          shopt -s nullglob
          IMAGES=(dist/a24_*/boot.img)
          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "::error title=No boot.img to verify::the build reported success but produced no dist/a24_*/boot.img"
            exit 1
          fi
          python3 scripts/check_built_boot.py "${IMAGES[@]}" 2>&1 | tee verify.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            MSG=$(tail -c 2500 verify.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Boot image would not boot::${MSG}"
          fi
          exit "$RC"

      # The Actions job log is served from blob storage that some networks
      # cannot reach, so on failure the tail of the trace is attached as a
      # workflow annotation, which is always reachable.
      - name: Report failure inline
        if: failure()
        run: |
          echo "=== dist tree ==="
          ls -la dist/ 2>/dev/null || echo "(dist missing)"
          find dist -name 'boot.img' 2>/dev/null || true
          echo "=== verify log ==="
          cat verify.log 2>/dev/null || echo "(no verify.log)"
          if [ -f build-trace.log ]; then
            MSG=$(tail -c 4000 build-trace.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build trace tail::${MSG}"
          else
            echo "::error title=Build trace::build-trace.log missing"
          fi

      - name: Collect build info
        id: info
        if: success()
        run: |
          D="$(ls -d dist/a24_* 2>/dev/null | tail -1)"
          if [ -z "$D" ]; then echo "no dist output produced"; exit 1; fi
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          cat "$D/build-info.env" >> "$GITHUB_OUTPUT"
          du -sh "$D"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-${{ matrix.variant }}
          path: dist/a24_*/
          retention-days: 30

  release:
    needs: [prepare, build]
    # Publishing is opt-in. A tag push builds and uploads artifacts, but
    # does NOT create a release unless publish=true is passed explicitly --
    # tag pushes are used for routine CI iterations, and those must never
    # silently publish.
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Each build job uploads its own dist/a24_<variant>_<base>_<stamp>/ under an
      # artifact called kernel-<variant>, so the paths are already unique. They
      # must stay unique: flattening everything into one directory made the
      # three boot.img files overwrite each other, so the release shipped a
      # single image with no indication of which variant it belonged to.
      - name: Collect artifacts, preserving the variant in every filename
        run: |
          set -euo pipefail
          echo "--- raw artifact tree ---"
          find artifacts -type f | sort || true

          mkdir -p release
          shopt -s globstar nullglob
          count=0
          for f in artifacts/**/*; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            # The variant is in the artifact directory (kernel-<variant>) and,
            # for the tarballs, in the filename itself (a24_<variant>_...).
            variant=""
            for v in vanilla kernelsu-up kernelsu; do
              case "$f" in
                *"/kernel-$v/"*|*"a24_${v}_"*) variant="$v"; break ;;
              esac
            done
            case "$base" in
              *.tar.gz)            cp "$f" "release/$base"; count=$((count+1)) ;;
              vbmeta.img)          [ -n "$variant" ] && cp "$f" "release/vbmeta-${variant}.img" ;;
              boot.img)            [ -n "$variant" ] && cp "$f" "release/boot-${variant}.img" ;;
              config-*)            [ -n "$variant" ] && cp "$f" "release/config-${variant}" ;;
              build-info.env)      [ -n "$variant" ] && cp "$f" "release/build-info-${variant}.env" ;;
              defconfig-report.md) [ -n "$variant" ] && cp "$f" "release/defconfig-report-${variant}.md" ;;
              build.log)           [ -n "$variant" ] && cp "$f" "release/build-${variant}.log" ;;
              *)                   [ -n "$variant" ] && cp "$f" "release/${variant}-${base}" ;;
            esac
          done

          # Tester-facing helpers: the device check script and the flashing
          # guide belong next to the images, not buried in the repo.
          cp scripts/check_device.py release/check_device.py 2>/dev/null || true
          cp scripts/analyze_bootlog.py release/analyze_bootlog.py 2>/dev/null || true
          cp docs/TESTER-FEEDBACK-2.md release/TESTER-FEEDBACK-2.md 2>/dev/null || true
          cp docs/FLASHING.md release/FLASHING.md 2>/dev/null || true

          echo "tarballs collected: $count"
          echo "--- release contents ---"
          ls -la release/

      # The manager APK version MUST equal the kernel's version code, otherwise
      # the app reports the kernel as unsupported. We record what we built and
      # attach the matching upstream APK when one can be resolved.
      # The manager APK version MUST equal the kernel's version code, otherwise
      # the app reports the kernel as unsupported. Each build job recorded that
      # code in build-info-<variant>.env, so the APK is chosen from it rather
      # than from "whatever tag happens to be newest".
      - name: Resolve matching manager APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source config.env

          get_code() {
            local f="release/build-info-$1.env"
            [ -f "$f" ] || { echo none; return; }
            sed -n 's/^KERNELSU_VERSION_CODE=//p' "$f" | head -1
          }

          # --- KernelSU-Next (variant: kernelsu) ---
          CODE_N="$(get_code kernelsu)"
          echo "built kernelsu version code: ${CODE_N}"
          {
            echo "variant=kernelsu"
            echo "kernel_version_code=${CODE_N}"
            echo "source=${KSU_NEXT_REPO} @ ${KSU_NEXT_REF}"
          } > release/kernelsu-version.txt

          if [ "${CODE_N}" != "none" ] && [ -n "${CODE_N}" ]; then
            # Walk upstream tags newest-first and stop at the release whose APK
            # filename carries exactly this version code.
            FOUND=""
            for TAG in $(gh api repos/KernelSU-Next/KernelSU-Next/releases --jq '.[].tag_name' | head -20); do
              if gh release view "$TAG" -R KernelSU-Next/KernelSU-Next --json assets \
                   --jq '.assets[].name' 2>/dev/null | grep -q "${CODE_N}"; then
                FOUND="$TAG"; break
              fi
            done
            if [ -n "$FOUND" ]; then
              echo "matching KernelSU-Next release: $FOUND"
              gh release download "$FOUND" -R KernelSU-Next/KernelSU-Next \
                -p "*_${CODE_N}-release.apk" -D release/ || true
              gh release download "$FOUND" -R KernelSU-Next/KernelSU-Next \
                -p 'aarch64_android12-5.10*.ko' -D release/ || true
              echo "$FOUND" > release/kernelsu-tag.txt
            else
              echo "::warning::no upstream KernelSU-Next release ships versionCode ${CODE_N}"
              echo "none" > release/kernelsu-tag.txt
            fi
          fi

          # --- upstream KernelSU (variant: kernelsu-up) ---
          CODE_U="$(get_code kernelsu-up)"
          echo "built kernelsu-up version code: ${CODE_U}"
          {
            echo "variant=kernelsu-up"
            echo "kernel_version_code=${CODE_U}"
            echo "source=${KSU_UPSTREAM_REPO} @ ${KSU_UPSTREAM_REF}"
          } > release/kernelsu-up-version.txt

          if [ "${CODE_U}" != "none" ] && [ -n "${CODE_U}" ]; then
            FOUNDU=""
            for TAG in $(gh api repos/tiann/KernelSU/releases --jq '.[].tag_name' | head -20); do
              if gh release view "$TAG" -R tiann/KernelSU --json assets \
                   --jq '.assets[].name' 2>/dev/null | grep -q "${CODE_U}"; then
                FOUNDU="$TAG"; break
              fi
            done
            if [ -n "$FOUNDU" ]; then
              echo "matching upstream KernelSU release: $FOUNDU"
              gh release download "$FOUNDU" -R tiann/KernelSU -p "*_${CODE_U}-release.apk" -D release/ || true
              echo "$FOUNDU" > release/kernelsu-up-tag.txt
            else
              echo "::warning::no upstream KernelSU release ships versionCode ${CODE_U}"
              echo "none" > release/kernelsu-up-tag.txt
            fi
          fi

          # Fail loudly rather than shipping a release with a mismatched pair.
          if ls release/*.apk >/dev/null 2>&1; then
            echo "APKs attached:"; ls -1 release/*.apk
          else
            echo "::warning::no manager APK could be matched to the built kernel version codes"
          fi
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      # No `if: hashFiles(...)` here. hashFiles only searches under
      # $GITHUB_WORKSPACE, and its result in a step-level condition is not
      # reliable, so the step silently skipped even though three tarballs had
      # just been collected. The guard below fails loudly instead.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prefer the explicit tag input so a manual run can name the release
          # (e.g. v1.0.0-kernel) instead of getting a throwaway date stamp.
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            TAG="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
          echo "publishing as: $TAG"

          shopt -s nullglob
          TARS=(release/*.tar.gz)
          if [ ${#TARS[@]} -eq 0 ]; then
            echo "::error::no tarball was collected, refusing to publish"
            exit 1
          fi
          echo "attaching ${#TARS[@]} odin payload(s): ${TARS[*]}"

          # Put the identity of the build in the release notes. Asset downloads
          # have been unreliable and the notes are the one thing that is always
          # readable, so the source tree, its version, the config profile and
          # the exact LOCALVERSION go here rather than only into a file.
          {
            cat docs/RELEASE_NOTES.md
            echo
            echo "## This build"
            echo
            echo '| | |'
            echo '|---|---|'
            for v in vanilla kernelsu kernelsu-up; do
              f="release/build-info-${v}.env"
              [ -f "$f" ] || continue
              kv=$(grep '^KERNEL_VERSION=' "$f" | cut -d= -f2-)
              kr=$(grep '^KERNEL_REPO=' "$f" | cut -d= -f2-)
              kb=$(grep '^KERNEL_BRANCH=' "$f" | cut -d= -f2-)
              cp=$(grep '^CONFIG_PROFILE=' "$f" | cut -d= -f2-)
              lv=$(grep '^LOCALVERSION=' "$f" | cut -d= -f2-)
              echo "| \`${v}\` kernel | ${kv} |"
              echo "| source | ${kr} @ \`${kb}\` |"
              echo "| config profile | ${cp} |"
              echo "| LOCALVERSION | \`${lv}\` |"
              break
            done
            echo
            echo "The same values are in \`build-info-<variant>.env\` and"
            echo "\`defconfig-report-<variant>.md\`."
          } > /tmp/notes.md
          gh release create "$TAG" release/* \
            --title "Kernel build ${TAG}" \
            --notes-file /tmp/notes.md \
            --prerelease
