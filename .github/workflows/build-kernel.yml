name: Build kernel

# ============================================================================
#  Builds three kernel variants for the Samsung Galaxy A24 (SM-A245F) against
#  the A245FXXS9DYG1 firmware base, then publishes a single GitHub Release
#  containing the Odin payloads and the exactly-matching manager APKs.
#
#  Why CI: the kernel is a 5.10 GKI tree with the whole MediaTek vendor module
#  set. It needs ~16 GB of disk and several GB of RAM, plus flex/bison and a
#  full clang toolchain. Running it on GitHub runners keeps the build
#  reproducible and keeps produced binaries out of git history.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which variant to build'
        required: true
        default: 'all'
        type: choice
        options: [all, vanilla, kernelsu, kernelsu-up]
      hardened:
        description: 'Keep Samsung security features on (RKP/KDP/DEFEX/FIVE/PROCA). Boot is unlikely.'
        required: true
        default: false
        type: boolean
      publish:
        description: 'Publish a GitHub Release'
        required: true
        default: false
        type: boolean

  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          V="${{ github.event.inputs.variant || 'all' }}"
          if [ "$V" = "all" ]; then
            echo 'matrix=["vanilla","kernelsu","kernelsu-up"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$V\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # kconfig frontend needs these; we avoid them at configure time but the
      # final `make` still invokes scripts that benefit from them.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev lz4 zstd cpio \
            python3 python3-pip rsync kmod
          pip3 install --quiet kconfiglib

      - name: Show toolchain budget
        run: |
          echo "CPUs : $(nproc)"
          echo "RAM  : $(free -h | awk '/Mem:/{print $2}')"
          echo "DISK : $(df -h / | awk 'NR==2{print $4}')"

      - name: Cache kernel source and toolchain
        uses: actions/cache@v4
        with:
          path: |
            work/kernel
            work/toolchain
          key: ksrc-${{ hashFiles('config.env') }}

      - name: Build ${{ matrix.variant }}
        run: |
          chmod +x scripts/*.sh scripts/*.py
          FLAGS="--variant ${{ matrix.variant }} --jobs $(nproc)"
          if [ "${{ github.event.inputs.hardened }}" = "true" ]; then
            FLAGS="$FLAGS --harden"
          fi
          ./scripts/build-kernel.sh $FLAGS

      - name: Collect build info
        id: info
        run: |
          D="$(ls -d dist/a24_* | tail -1)"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          cat "$D/build-info.env" >> "$GITHUB_OUTPUT"
          du -sh "$D"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: dist/a24_*/
          retention-days: 30

  release:
    needs: [prepare, build]
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.img' -o -name '*.md' -o -name 'config-*' \) \
            -exec cp {} release/ \;
          ls -la release/

      # The manager APK version MUST equal the kernel's version code, otherwise
      # the app reports the kernel as unsupported. We record what we built and
      # attach the matching upstream APK when one can be resolved.
      - name: Resolve matching manager APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source config.env
          # KernelSU-Next manager
          TAGN="$(gh api "$KSU_NEXT_UPSTREAM_API" --jq .tag_name || true)"
          echo "upstream KernelSU-Next: ${TAGN:-<none>}"
          echo "${TAGN:-none}" > release/kernelsu-next-tag.txt
          if [ -n "$TAGN" ]; then
            gh release download "$TAGN" -R KernelSU-Next/KernelSU-Next -p '*_KernelSU_Next_*.apk' -D release/ || true
            gh release download "$TAGN" -R KernelSU-Next/KernelSU-Next -p 'aarch64_android12-5.10*.ko' -D release/ || true
          fi
          # upstream KernelSU manager
          TAGU="$(gh api "$KSU_UPSTREAM_API" --jq .tag_name || true)"
          echo "upstream KernelSU: ${TAGU:-<none>}"
          echo "${TAGU:-none}" > release/kernelsu-upstream-tag.txt
          if [ -n "$TAGU" ]; then
            gh release download "$TAGU" -R tiann/KernelSU -p '*_KernelSU_v*.apk' -D release/ || true
          fi
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Publish release
        if: hashFiles('release/*.tar.gz') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
          gh release create "$TAG" release/* \
            --title "Kernel build ${TAG}" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease
